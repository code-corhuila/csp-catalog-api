spring:
  application:
    name: catalog-api
  lifecycle:
    timeout-per-shutdown-phase: 20s   # graceful shutdown: in-flight requests may finish for 20 s
  jackson:
    serialization:
      # catalog-service.yaml declares every date as format: date, never as the numbers of an array.
      write-dates-as-timestamps: false
  data:
    mongodb:
      # One database per domain (Annex J.5). The URI comes from the environment; see .env.example.
      uri: ${MONGODB_URI:mongodb://localhost:27017/catalog_db?replicaSet=rs0}
server:
  port: ${PORT:8082}
  servlet:
    # catalog-service.yaml opens with this base: the service owns its prefix, so the same process
    # works with and without the gateway.
    context-path: /api/v1/catalog
  shutdown: graceful                  # stop accepting new requests, let the running ones finish
  tomcat:
    connection-timeout: 5s            # time to receive the request line and headers
    keep-alive-timeout: 60s           # idle connection
    threads:
      max: 200
# Explicit limits of the MongoDB client (Norma 5.3.10); MongoClientLimitsConfiguration applies them.
catalog:
  mongodb:
    max-pool-size: 10                 # size of the connection pool
    connection-wait: 5s               # wait for a connection of the pool
    connect-timeout: 5s               # time to open a connection
    server-selection-timeout: 5s      # time to find a node of the replica set
    read-timeout: 5s                  # time of a read or a write on the wire
logging:
  structured:
    format:
      console: ecs                    # one JSON object per line; the MDC adds the correlation id
