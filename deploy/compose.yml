# This service only. csp-infra-postgres includes this file to compose the platform.
name: csp-catalog-api

services:
  catalog-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8082"
      # Database of this domain (Annex J.5): the login catalog_app of the single MongoDB instance of csp-infra-mongo. It has
      # no role of its own: csp-catalog-db grants it catalog_writer when it migrates. Compose refuses to start without the
      # password, so a missing value is reported by name instead of failing inside the JVM. The password travels inside
      # a URI, so use characters that need no escaping (for example the output of `openssl rand -hex 24`).
      MONGODB_URI: mongodb://catalog_app:${CATALOG_APP_PASSWORD:?set CATALOG_APP_PASSWORD in .env or in the platform}@${MONGO_HOST:-mongodb}:27017/${CATALOG_DB_NAME:-catalog_db}?replicaSet=rs0&authSource=${CATALOG_DB_NAME:-catalog_db}
      # Public key every token is validated with (Norma 5.3.7): the PEM itself or the path of the file that holds it.
      # The service refuses to start without one of the two.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_FILE: ${JWT_PUBLIC_KEY_FILE:-}
      # Subjects of the service tokens allowed to read the availability of a showtime (ADR-042), comma separated. The
      # platform env files already use SERVICE_SUBJECTS for csp-worker, so the value of this service comes from its own name.
      SERVICE_SUBJECTS: ${CATALOG_SERVICE_SUBJECTS:-booking-service}
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8082"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
