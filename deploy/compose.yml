# This service only. csp-infra-postgres includes this file to compose the platform.
name: csp-catalog-api

services:
  catalog-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8082"
      # Database of this domain (Annex J.5): the login catalog_app of the single MongoDB instance of csp-infra-mongo. It has
      # no role of its own: csp-catalog-db grants it catalog_writer when it migrates. Compose refuses to start without the
      # password, so a missing value is reported by name instead of failing inside the JVM. The password travels inside
      # a URI, so use characters that need no escaping (for example the output of `openssl rand -hex 24`).
      MONGODB_URI: mongodb://catalog_app:${CATALOG_APP_PASSWORD:?set CATALOG_APP_PASSWORD in .env or in the platform}@${MONGO_HOST:-mongodb}:27017/${CATALOG_DB_NAME:-catalog_db}?replicaSet=rs0&authSource=${CATALOG_DB_NAME:-catalog_db}
      # Public key every token is validated with (Norma 5.3.7): the PEM itself or the path of the file that holds it.
      # The service refuses to start without one of the two.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_FILE: ${JWT_PUBLIC_KEY_FILE:-}
      # Certificate chain and private key the service serves HTTPS with (ADR-067), PEM files the platform mounts, issued by the
      # internal CA of the environment for catalog-api and localhost. Compose refuses to start without them, and so does the service.
      CATALOG_TLS_CERTIFICATE_FILE: ${CATALOG_TLS_CERTIFICATE_FILE:?set CATALOG_TLS_CERTIFICATE_FILE to the certificate the platform mounts}
      CATALOG_TLS_PRIVATE_KEY_FILE: ${CATALOG_TLS_PRIVATE_KEY_FILE:?set CATALOG_TLS_PRIVATE_KEY_FILE to the key the platform mounts}
      # The CA that signed that certificate (public). Only the healthcheck below reads it: it verifies the certificate like any caller.
      CATALOG_TLS_CA_FILE: ${CATALOG_TLS_CA_FILE:?set CATALOG_TLS_CA_FILE to the CA certificate the platform mounts}
      # Subjects of the service tokens allowed to read the availability of a showtime (ADR-042), comma separated. The
      # platform env files already use SERVICE_SUBJECTS for csp-worker, so the value of this service comes from its own name.
      SERVICE_SUBJECTS: ${CATALOG_SERVICE_SUBJECTS:-booking-service}
    # Healthy only while MongoDB answers the ping of GET /health/ready (DEC-012); compose reports it and does not restart
    # the container for it. The timeout leaves room for the 503 that readiness answers after waiting up to 5 s for
    # MongoDB (server selection, Norma 5.3.10). The path includes the context-path of application.yml. The JRE image ships curl.
    # The service answers HTTPS only (ADR-067), so curl verifies the certificate with the CA file; localhost is one of its names.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert \"$$CATALOG_TLS_CA_FILE\" https://localhost:8082/api/v1/catalog/health/ready"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 40s
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8082"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
